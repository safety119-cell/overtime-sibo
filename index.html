<title>초과근무 시보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column — night-blue header with live clock, cards below, fixed bottom tab bar */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#16233A; --muted:#5E6B80; --line:#DCE3EE;
  --navy:#1F3A63; --navy2:#2B4E80; --on-navy:#FFFFFF; --on-navy-sub:#BFD0EA;
  --amber:#E08A1E; --amber-ink:#8A4F00; --amber-soft:#FDF0DC;
  --green:#1F9D63; --green-soft:#E2F5EC; --red:#D6455D; --red-soft:#FBE6EA;
  --blue:#2F62B5; --blue-soft:#E6EEFA; --slate-soft:#EEF1F5;
  --shadow:0 1px 2px rgba(22,35,58,.06),0 4px 14px rgba(22,35,58,.06);
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-logo:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1623; --surface:#172133; --ink:#E7ECF4; --muted:#98A4B8; --line:#27344C;
  --navy:#16294A; --navy2:#22406E; --on-navy:#FFFFFF; --on-navy-sub:#A9BCDC;
  --amber:#F0A847; --amber-ink:#F6C27A; --amber-soft:#3A2A12;
  --green:#3CC184; --green-soft:#12301F; --red:#F06A80; --red-soft:#3A1720;
  --blue:#7FA8EE; --blue-soft:#1C2A44; --slate-soft:#1E2738;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1623; --surface:#172133; --ink:#E7ECF4; --muted:#98A4B8; --line:#27344C;
  --navy:#16294A; --navy2:#22406E; --on-navy:#FFFFFF; --on-navy-sub:#A9BCDC;
  --amber:#F0A847; --amber-ink:#F6C27A; --amber-soft:#3A2A12;
  --green:#3CC184; --green-soft:#12301F; --red:#F06A80; --red-soft:#3A1720;
  --blue:#7FA8EE; --blue-soft:#1C2A44; --slate-soft:#1E2738;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{background:linear-gradient(160deg,var(--navy),var(--navy2));color:var(--on-navy);margin-inline:-16px;padding:18px 20px 22px;border-radius:0 0 22px 22px;display:grid;gap:4px}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:var(--f-logo);font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.hdr .chip{background:rgba(255,255,255,.14);color:var(--on-navy)}
.date{color:var(--on-navy-sub);font-size:13px;margin-top:6px}
.clock{font-size:46px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.clock small{font-size:22px;color:var(--on-navy-sub);font-weight:500;margin-left:2px}
.next{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--on-navy-sub);flex-wrap:wrap}
.next b{color:var(--amber-ink);font-weight:700}
:root .hdr .next b{color:#FFC977}

/* cards */
.stack{display:grid;gap:12px;margin-top:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{font-size:12px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.notice{background:var(--red-soft);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.55}
.notice b{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:13px;font-weight:700;font-size:15px;text-align:center}
.btn-primary{background:var(--navy);color:var(--on-navy)}
.btn-amber{background:var(--amber);color:#2A1700}
.btn-green{background:var(--green);color:#fff}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-ghost{background:var(--slate-soft);color:var(--ink)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-block{width:100%}
.link{color:var(--blue);font-weight:500;text-decoration:none}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--slate-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:38px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:500;color:var(--muted)}
.input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;width:100%}
.stepper{display:grid;grid-template-columns:46px 1fr 46px auto;gap:8px;align-items:center}
.stepper .val{text-align:center;font-size:20px;font-weight:700}
.stepper button.sq{height:46px;border-radius:12px;background:var(--slate-soft);font-size:22px;font-weight:500}

/* plan preview */
.preview{background:var(--blue-soft);border-radius:14px;padding:14px;display:grid;gap:4px}
.preview .big{font-size:24px;font-weight:700;color:var(--blue)}
.preview ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.preview.err{background:var(--red-soft)}
.preview.err .big{color:var(--red);font-size:16px}

/* summary */
.sum-end{font-size:30px;font-weight:700;line-height:1.15}
.bar{height:10px;border-radius:99px;background:var(--slate-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}

/* now card */
.nowcard{border:2px solid transparent}
.nowcard.need{border-color:var(--amber);background:linear-gradient(var(--amber-soft),var(--amber-soft)) padding-box}
.nowhour{font-size:26px;font-weight:700}
.path{background:var(--slate-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.path b{color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-wait{background:var(--slate-soft);color:var(--muted)}
.p-need{background:var(--amber);color:#2A1700}
.p-done{background:var(--green-soft);color:var(--green)}
.p-miss{background:var(--red-soft);color:var(--red)}
.p-meal{background:var(--amber-soft);color:var(--amber-ink)}
.p-away{background:var(--blue-soft);color:var(--blue)}
.p-end{background:var(--slate-soft);color:var(--muted)}

/* timeline */
.tl{display:grid}
.tl-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl-h{font-weight:700;font-size:16px}
.tl-row.cur{background:var(--amber-soft);border-radius:12px;padding-inline:8px;border-top-color:transparent}
.tl-row.cur+.tl-row{border-top-color:transparent}
.undo{font-size:12px;color:var(--blue);font-weight:500;padding:4px 0}

/* lists/tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
.reason{color:var(--red);font-weight:700}
.gcal{display:grid;gap:6px}
.gcal a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--slate-soft);color:var(--ink);text-decoration:none;font-size:14px}
.gcal a span:last-child{color:var(--blue);font-weight:700;font-size:13px}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times span{background:var(--slate-soft);padding:4px 10px;border-radius:8px;font-weight:700;font-size:14px}

/* toggles */
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.tg .t{font-weight:500}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
details{border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"＋";color:var(--muted)}
details[open] summary::after{content:"－"}
ol.help{margin:8px 0 0;padding-left:20px;font-size:14px;display:grid;gap:4px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:480px}
.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--navy);background:var(--blue-soft);font-weight:700}
:root .tabs button[aria-current="page"]{color:var(--blue)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:24px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto}
.sheet-band{padding:16px 20px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.band-amber{background:var(--amber);color:#2A1700}
.band-green{background:var(--green);color:#fff}
.band-navy{background:var(--navy);color:#fff}
.sheet-body{padding:18px 20px 20px;display:grid;gap:14px}
.sheet-title{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance}
@media (prefers-reduced-motion:no-preference){.ring{animation:ring 1s ease-in-out infinite}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
</style>

    <div class="hdr-top">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#FFC977" stroke-width="2.4"/><path d="M13 7v6l4 2.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        초과근무 시보

    <button data-tab="log"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>기록</button>

<script>
(function(){
'use strict';
/* ───────── 저장소 ───────── */
var LS='otsibo.v1.';
function load(k,d){try{var v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function store(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));}catch(e){}}
var DEF={cs:30,ce:40,gap:2,friday:true,endAlarm:true,google:false};
var cfg=Object.assign({},DEF,load('cfg',{}));
var days=load('days',{});
function saveCfg(){store('cfg',cfg);}
function saveDays(){
  var keys=Object.keys(days).sort();
  while(keys.length>62){delete days[keys.shift()];}
  store('days',days);
}

/* ───────── 공휴일 (참고용, 직접 바꿀 수 있음) ───────── */
var HOLI={
 '2026-12-25':'성탄절',
 '2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일(설날)',
 '2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일(노동절)','2027-05-05':'어린이날','2027-05-13':'부처님오신날',
 '2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일(제헌절)','2027-08-15':'광복절','2027-08-16':'대체공휴일(광복절)',
 '2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일(개천절)',
 '2027-10-09':'한글날','2027-10-11':'대체공휴일(한글날)','2027-12-25':'성탄절','2027-12-27':'대체공휴일(성탄절)'
};

/* ───────── 날짜·시간 도우미 ───────── */
var WD=['일','월','화','수','목','금','토'];
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function hm(min){min=Math.round(min);return pad(Math.floor(min/60)%24)+':'+pad(min%60);}
function fmtDur(min){min=Math.max(0,Math.round(min));var h=Math.floor(min/60),m=min%60;if(h&&m)return h+'시간 '+m+'분';if(h)return h+'시간';return m+'분';}
function fmtLeft(ms){var s=Math.max(0,Math.ceil(ms/1000));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;if(h)return h+'시간 '+m+'분';if(m)return m+'분 '+pad(x)+'초';return x+'초';}
function atMin(dateStr,min){var d=parseYmd(dateStr);d.setMinutes(min);return d;}
function nowMin(d){return d.getHours()*60+d.getMinutes();}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isWeekendDate(s){var d=parseYmd(s);return d.getDay()===0||d.getDay()===6||!!HOLI[s];}

/* ───────── 근무 규칙과 종료 시각 계산 ───────── */
function rulesFor(dateStr,weekend){
  var fri=!weekend&&cfg.friday&&parseYmd(dateStr).getDay()===5;
  if(weekend)return{label:'주말·공휴일',max:8,ded:0,segs:[[360,1260]],range:'06:00~21:00',fri:false};
  if(fri)return{label:'금요일',max:7,ded:60,segs:[[360,540]],range:'06:00~09:00',fri:true};
  return{label:'평일',max:7,ded:60,segs:[[360,540],[1080,1380]],range:'06:00~09:00, 18:00~23:00',fri:false};
}
function calcPlan(p){
  var r=rulesFor(p.date,p.weekend);
  var t=p.start.split(':'),st=(+t[0])*60+(+t[1]);
  var want=Math.min(p.want,r.max),last=r.segs[r.segs.length-1][1],notes=[];
  if(st>=last)return{ok:false,label:r.label,msg:r.fri?'금요일(정시퇴근의 날)은 06:00~09:00에만 초과근무를 할 수 있어요. 설정에서 끌 수 있어요.':r.label+' 초과근무는 '+r.range+'에만 할 수 있어요.'};
  var eff=null,i;
  for(i=0;i<r.segs.length;i++){if(st<r.segs[i][1]){eff=Math.max(st,r.segs[i][0]);break;}}
  if(eff>st){
    if(st<360)notes.push('06:00 전은 초과근무로 세지 않아 '+hm(eff)+'부터 계산했어요.');
    else if(!p.weekend)notes.push('09:00~18:00은 정규 근무 시간이라 '+hm(eff)+'부터 계산했어요.');
  }
  if(r.fri)notes.push('금요일은 정시퇴근의 날이라 18시 이후는 계산에서 뺐어요.');
  if(!p.weekend&&!r.fri&&st>=1200)notes.push('평일은 20:00 전 청사 귀청이 원칙이에요. 시작 시각을 다시 확인해 주세요.');
  var need=Math.round(want*60)+r.ded,acc=0,end=null,gap=false,prevE=null;
  for(i=0;i<r.segs.length;i++){
    var S=r.segs[i][0],E=r.segs[i][1];
    if(E<=eff)continue;
    var s=Math.max(S,eff);
    if(prevE!==null&&s>prevE)gap=true;
    var av=E-s;
    if(acc+av>=need){end=s+(need-acc);acc=need;break;}
    acc+=av;prevE=E;
  }
  var capped=false;if(end===null){end=last;capped=true;}
  var rec=Math.max(0,acc-r.ded);
  if(gap)notes.push('09:00~18:00 정규 근무 시간은 빼고 이어서 계산했어요.');
  if(capped)notes.push(r.label+'은 '+hm(last)+'까지만 가능해서 인정 시간이 '+fmtDur(rec)+'으로 줄어요.');
  return{ok:true,label:r.label,startMin:eff,endMin:end,rec:rec,count:acc,ded:r.ded,capped:capped,notes:notes,want:want,max:r.max,segs:r.segs,fri:r.fri};
}
function mealHour(m){return m==='breakfast'?8:m==='dinner'?18:-1;}
function mealName(m){return m==='breakfast'?'조식':m==='dinner'?'석식':'';}
function alarmHours(p,plan){
  var out=[];if(!plan||!plan.ok)return out;
  for(var h=0;h<24;h++){
    var ws=h*60+cfg.cs,we=h*60+cfg.ce;
    if(we<plan.startMin||ws>plan.endMin)continue;
    var inSeg=plan.segs.some(function(g){return ws>=g[0]&&ws<g[1];});
    if(!inSeg)continue;
    out.push({h:h,meal:!p.weekend&&!plan.fri&&mealHour(p.meal)===h});
  }
  return out;
}

/* 시간이 지나면서 바뀌는 기록을 자동으로 남김 */
function reconcile(now){
  var day=getDay();if(!day.p)return false;
  var plan=calcPlan(day.p),al=alarmHours(day.p,plan),nm=nowMin(now),changed=false;
  al.forEach(function(a){
    if(day.rec[a.h])return;
    var ws=a.h*60+cfg.cs,we=a.h*60+cfg.ce;
    if(day.ended&&nm<=we)return;
    if(a.meal){if(nm>=a.h*60){addRec(day,a.h,'meal','미기록 사유: '+mealName(day.p.meal));changed=true;}return;}
    if(day.away&&nm>=ws){addRec(day,a.h,'away','자리비움 중 지나감');day.away.hours.push(a.h);changed=true;return;}
    if(nm>we){addRec(day,a.h,'miss',day.p.startedAt&&day.p.startedAt>ws?'앱 시작 전에 지나감':'알림에 응답 없이 시간대가 끝남');changed=true;}
  });
  if(changed)saveDays();
  return changed;
}

var actx=null,ringTimer=null,wakeLock=null,wantWake=false;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}

function beep(){
  if(!actx)return;try{if(actx.state==='suspended')actx.resume();
  var t=actx.currentTime;[0,.28,.56].forEach(function(o,i){
    var osc=actx.createOscillator(),g=actx.createGain();osc.type='sine';osc.frequency.value=i===2?1175:880;
    g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.45,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.22);
    osc.connect(g);g.connect(actx.destination);osc.start(t+o);osc.stop(t+o+.25);});}catch(e){}
}
function startRing(){stopRing();var n=0;var f=function(){beep();try{navigator.vibrate&&navigator.vibrate([400,200,400,200,700]);}catch(e){}if(++n>=10)stopRing();};f();ringTimer=setInterval(f,3000);}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null;}try{navigator.vibrate&&navigator.vibrate(0);}catch(e){}}
function setWake(on){
  wantWake=on;
  if(on){if(!('wakeLock' in navigator)){wantWake=false;toast('이 브라우저는 화면 켜두기를 지원하지 않아요.');renderToday();return;}
    navigator.wakeLock.request('screen').then(function(l){wakeLock=l;l.addEventListener('release',function(){wakeLock=null;renderToday();});renderToday();}).catch(function(){wantWake=false;toast('화면 켜두기를 켜지 못했어요.');renderToday();});
  }else{if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null;}renderToday();}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){if(wantWake&&!wakeLock)setWake(true);tick(true);}});

function calEvents(day,plan,fromNow){
  var ev=[],nm=nowMin(new Date());
  alarmHours(day.p,plan).forEach(function(a){
    if(a.meal||day.rec[a.h])return;
    var ws=a.h*60+cfg.cs,we=a.h*60+cfg.ce;
    var note=(!day.p.weekend&&a.h===19)?' ※ 석식 후 19시 넘어 퇴근하면 이 시간 확인은 꼭 누르세요.':'';
    if(!fromNow||ws>nm)ev.push({min:ws,title:'⏰ 초과근무 확인 '+a.h+'시',desc:'차세대 인사랑 → 초과근무 기록 → '+a.h+'시 [확인]을 직접 누르세요.'+note});
    var w2=ws+cfg.gap;if(w2<=we&&(!fromNow||w2>nm))ev.push({min:w2,title:'⏰ 다시 알림 '+a.h+'시 확인',desc:'아직 안 눌렀다면 지금 인사랑에서 '+a.h+'시 [확인]을 누르세요.'});
  });
  if(cfg.endAlarm&&(!fromNow||plan.endMin>nm))ev.push({min:plan.endMin,title:'✅ 초과근무 종료 예정',desc:'미기록 사유 입력과 근무기록 확인결재(본인 상신)를 잊지 마세요.'});
  return ev.sort(function(a,b){return a.min-b.min;});
}
function utcStamp(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';}
function icsText(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}

  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//overtime-sibo//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'],stamp=utcStamp(new Date());
  evs.forEach(function(e,i){var d=atMin(day.date||today,e.min);
    L.push('BEGIN:VEVENT','UID:otsibo-'+today+'-'+e.min+'-'+i+'@local','DTSTAMP:'+stamp,'DTSTART:'+utcStamp(d),'DTEND:'+utcStamp(new Date(d.getTime()+60000)),

/* ───────── 매초 점검 ───────── */
var lastSig='';
function tick(force){
  var now=new Date();
  if(ymd(now)!==today){today=ymd(now);draft=null;editing=false;closeModal();force=true;}
  var day=getDay(),nm=nowMin(now);
  // 머리글
  var c=document.getElementById('hdrClock');c.innerHTML=pad(now.getHours())+':'+pad(now.getMinutes())+'<small>:'+pad(now.getSeconds())+'</small>';
  document.getElementById('hdrDate').textContent=now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+WD[now.getDay()]+'요일'+(HOLI[today]?' · '+HOLI[today]:'');
  var changed=reconcile(now);
  var plan=day.p?calcPlan(day.p):null,al=plan?alarmHours(day.p,plan):[];
  document.getElementById('hdrType').textContent=plan&&plan.ok?plan.label:(isWeekendDate(today)?'주말·공휴일':'평일');
  // 다음 알림
  var nx=document.getElementById('hdrNext'),nextTxt='오늘 시작 설정을 하면 알림이 예약돼요.';
  if(plan&&plan.ok){
    nextTxt='오늘 남은 확인 알림이 없어요.';
    if(day.ended)nextTxt='오늘 근무를 끝냈어요. 알림이 꺼져 있어요.';
    else if(day.away)nextTxt='자리비움 중 · 알림을 쉬고 있어요.';
    else for(var i=0;i<al.length;i++){var st=hourStatus(day,al[i],nm);
      if(st==='need'){var s=day.al[al[i].h]||{},t=s.snooze||(s.n===1?s.next:0);nextTxt='<b>'+al[i].h+'시 확인 중</b>'+(t&&t>now?' · 다시 알림 '+fmtLeft(t-now):' · 인사랑에서 눌러 주세요');break;}
      if(st==='wait'){var at=atMin(today,al[i].h*60+cfg.cs);nextTxt='다음 알림 <b class="num">'+hm(al[i].h*60+cfg.cs)+'</b> · '+fmtLeft(at-now)+' 남음';break;}}
  }
  nx.innerHTML=nextTxt;
  var el=document.getElementById('endLeft');if(el&&plan&&plan.ok){var lf=atMin(today,plan.endMin)-now;el.textContent=lf>0?fmtLeft(lf)+' 남음':'종료 시각이 지났어요';}
  // 알림 띄우기
  if(plan&&plan.ok&&!day.ended){
    al.forEach(function(a){
      var st=hourStatus(day,a,nm);
      if(st!=='need'){if(modal&&modal.type==='check'&&modal.h===a.h)closeModal();return;}
      var s=day.al[a.h]=day.al[a.h]||{n:0,next:0,snooze:0},t=now.getTime();
      if(modal)return;
      if(s.n===0){s.n=1;s.next=t+cfg.gap*60000;saveDays();showCheckModal(a.h,1);}
      else if(s.snooze&&t>=s.snooze){s.snooze=0;if(s.n<2)s.n=2;saveDays();showCheckModal(a.h,2);}
      else if(!s.snooze&&s.n===1&&t>=s.next){s.n=2;saveDays();showCheckModal(a.h,2);}
    });
    if(cfg.endAlarm&&!day.endShown&&nm>=plan.endMin&&nm<plan.endMin+30&&!modal){day.endShown=true;saveDays();showEndModal();}
  }
  if(modal&&modal.type==='check'){var rr=day.rec[modal.h];if(rr)closeModal();}
  // 상태가 바뀌었을 때만 화면 다시 그리기
  var sig=today+'|'+JSON.stringify(day.rec)+'|'+(day.p?day.p.start+day.p.want+day.p.meal+day.p.weekend:'')+'|'+!!day.away+'|'+!!day.ended+'|'+(al.map(function(a){return hourStatus(day,a,nm);}).join(','))+'|'+nm;
  if(force||changed||sig!==lastSig){lastSig=sig;renderCurrent();}
}

  if(curTab==='today'){var f=document.activeElement&&document.activeElement.id==='inStart';if(!f)renderToday();}
  else if(curTab==='log')renderLog();
}

  var tb=e.target.closest('[data-tab]');if(tb){switchTab(tb.dataset.tab);return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,v=b.dataset.v,day=getDay(),now=new Date();
  unlockAudio();
  switch(act){
    case 'dtype':draft.weekend=v==='1';draft.start=draft.weekend?'09:00':'18:00';draft.want=Math.min(draft.want,draft.weekend?8:7);if(draft.weekend)draft.meal='none';renderToday();break;
    case 'nowstart':draft.start=pad(now.getHours())+':'+pad(now.getMinutes());renderToday();break;
    case 'want':draft.want=Math.max(0.5,Math.min(draft.weekend?8:7,draft.want+parseFloat(v)));renderToday();break;
    case 'wantmax':draft.want=draft.weekend?8:7;renderToday();break;
    case 'meal':draft.meal=v;renderToday();break;
    case 'startPlan':
      var keepRec=editing;day.p=Object.assign({},draft,{date:today,startedAt:keepRec&&day.p&&day.p.startedAt?day.p.startedAt:nowMin(now)});
      if(!keepRec){day.rec={};day.al={};}
      day.ended=false;day.endShown=false;draft=null;editing=false;saveDays();toast('시작했어요. 확인 시간에 알려 드릴게요.');tick(true);break;
    case 'edit':editing=true;draft=Object.assign({},day.p);renderToday();break;
    case 'cancelEdit':editing=false;draft=null;renderToday();break;
    case 'askEnd':confirmEnd=true;renderToday();break;
    case 'noEnd':confirmEnd=false;renderToday();break;
    case 'doEnd':confirmEnd=false;day.ended=true;if(day.away){day.away=null;}saveDays();closeModal();toast('오늘 근무를 끝냈어요.');tick(true);break;
    case 'unend':day.ended=false;saveDays();tick(true);break;
    case 'done':addRec(day,+b.dataset.h,hourStatus(day,{h:+b.dataset.h},nowMin(now))==='need'?'done':'pre','');saveDays();toast(b.dataset.h+'시 완료로 기록했어요.');tick(true);break;
    case 'toggleUndo':var hh=+b.dataset.h;openUndo=openUndo===hh?null:hh;renderToday();break;
    case 'undo':delete day.rec[+b.dataset.h];delete day.al[+b.dataset.h];openUndo=null;saveDays();toast('완료를 취소했어요.');tick(true);break;
    case 'away':
      if(day.away){awayForm={kind:'현장 출장',detail:'',doc:''};showAwayModal();}
      else{day.away={start:now.getTime(),startHM:hm(nowMin(now)),hours:[]};saveDays();toast('자리비움을 시작했어요. 알림을 쉬어요.');tick(true);}
      break;
    case 'akind':awayForm.kind=v;awayForm.detail=(document.getElementById('awDetail')||{}).value||'';awayForm.doc=(document.getElementById('awDoc')||{}).value||'';showAwayModal();break;
    case 'awaySave':
      var a=day.away;day.awayLog.push({s:a.startHM,e:hm(nowMin(now)),hours:a.hours.slice(),kind:awayForm.kind,detail:(document.getElementById('awDetail')||{}).value||'',doc:(document.getElementById('awDoc')||{}).value||''});
      day.away=null;saveDays();closeModal();toast('자리비움 기록을 저장했어요.');tick(true);break;
    case 'mDone':if(modal&&modal.type==='check'){addRec(day,modal.h,'done','');saveDays();}closeModal();toast('완료로 기록했어요.');tick(true);break;
    case 'mSnooze':if(modal&&modal.type==='check'){var s=day.al[modal.h]=day.al[modal.h]||{n:1};s.snooze=now.getTime()+cfg.gap*60000;saveDays();}closeModal();toast(cfg.gap+'분 뒤 다시 알려 드릴게요.');tick(true);break;
    case 'mClose':closeModal();break;
    case 'test':startRing();setTimeout(stopRing,3500);toast('소리와 진동을 시험하고 있어요.');break;
    case 'wake':setWake(!wakeLock);break;
    case 'ics':doIcs();break;
    case 'csv':doCsv();break;
    case 'gap':cfg.gap=+v;saveCfg();renderSet();break;
    case 'sw':cfg[b.dataset.k]=!cfg[b.dataset.k];saveCfg();renderSet();lastSig='';break;
    case 'askReset':confirmReset=true;renderSet();break;
    case 'noReset':confirmReset=false;renderSet();break;
    case 'doReset':confirmReset=false;cfg=Object.assign({},DEF);days={};saveCfg();saveDays();draft=null;editing=false;renderSet();toast('모두 지웠어요.');break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='inStart'&&draft){draft.start=t.value||draft.start;renderToday();}
  if(t.id==='selCs'||t.id==='selCe'){
    var cs=+document.getElementById('selCs').value,ce=+document.getElementById('selCe').value;
    if(cs>ce){toast('시작 분이 끝 분보다 늦을 수 없어요.');renderSet();return;}
    cfg.cs=cs;cfg.ce=ce;if(cfg.gap>ce-cs&&ce>cs){toast('다시 알림이 시간대 안에 들어가도록 간격을 줄여 주세요.');}saveCfg();lastSig='';
  }
});
document.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.hist){openHist=d.open?d.dataset.hist:(openHist===d.dataset.hist?null:openHist);}},true);

function doIcs(){
  var day=getDay(),plan=calcPlan(day.p),evs=calEvents(day,plan,true);
  if(!evs.length){toast('넣을 알림이 없어요.');return;}
  var ok=plainDownload('초과근무알림_'+today+'.ics',buildIcs(day,evs),'text/calendar');
  if(ok){toast('캘린더 파일을 열어 "추가"를 누르세요.');return;}
  showInfo('이 화면에서는 캘린더 파일을 받을 수 없어요','지금 보고 계신 미리보기 화면은 보안 정책상 캘린더 파일 내려받기를 막아요. 부서에 배포하는 주소로 열면 이 버튼이 바로 작동해요.<br><br>지금은 설정에서 <b>Google 캘린더 추가</b>를 켜서 쓰거나, 아래 시각으로 폰 시계 알람을 맞춰 주세요.<div class="times" style="margin-top:10px">'+evs.map(function(e){return '<span class="num">'+hm(e.min)+'</span>';}).join('')+'</div>');
}
function showInfo(title,html){
  modal={type:'info'};
  MR.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="sheet"><div class="sheet-band band-navy"><span id="mTitle">'+esc(title)+'</span></div><div class="sheet-body"><div class="small">'+html+'</div><button class="btn btn-primary btn-block" data-act="mClose">확인</button></div></div></div>';
}
function csvField(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"';}
function doCsv(){
  var L=[['날짜','구분','시작','종료 예정','인정','시간','결과','기록 시각','미기록 사유 필요','메모'].map(csvField).join(',')];
  Object.keys(days).sort().forEach(function(k){var d=days[k];if(!d.p)return;var pl=calcPlan(d.p);
    dayRows(k).forEach(function(x){L.push([k,pl.ok?pl.label:'',pl.ok?hm(pl.startMin):'',pl.ok?hm(pl.endMin):'',pl.ok?fmtDur(pl.rec):'',x.h+'시',x.r?RES[x.r].t:'',x.at,x.r&&needsReason(x.r)?'예':'',x.note].map(csvField).join(','));});
    (d.awayLog||[]).forEach(function(a){L.push([k,'자리비움',a.s,a.e,'',a.hours.map(function(v){return v+'시';}).join(' '),a.kind,'','예',(a.detail||'')+(a.doc?' / 공문 '+a.doc:'')].map(csvField).join(','));});
  });
  var text='\ufeff'+L.join('\r\n'),name='초과근무확인기록_'+today+'.csv';
  if(dlApi){dlApi.save({filename:name,data:text}).then(function(){toast('저장했어요.');}).catch(function(err){if(err&&err.code==='declined')toast('저장을 취소했어요.');else if(!plainDownload(name,text,'text/csv'))toast('이 화면에서는 파일을 저장할 수 없어요.');});return;}
  if(!plainDownload(name,text,'text/csv'))toast('이 화면에서는 파일을 저장할 수 없어요.');
}

/* ───────── 시작 ───────── */
switchTab('today');
tick(true);
setInterval(function(){tick(false);},1000);
})();
</script>
